# source this file after changes
unbind r
bind r source-file ~/.tmux.conf

# change prefix to CTRL + S
set -g prefix C-s

unbind-key C-b
bind-key C-s send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# # Switch panes using Alt-arrow without prefix
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# syntax highlighting in Vim
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# start numbering windows from 1 instead of zero
set -g base-index 1

# current session
# set -g status-left ' #S '
# set -g status-left-length 15
# set -g status-left-fg colour229
# set -g status-left-bg colour166

# window list
# set -g window-status-format "#[fg=colour8] #I #[fg=colour231]#W#[fg=colour166]#F "
# set -g window-status-current-format "#[fg=colour117,bg=colour31] #I #[fg=colour231]#W#[fg=colour234]#F *"
# set -g window-status-separator ""

# set -g window-style 'fg=color247,bg=color236'
# set -g window-active-style 'fg=color250,bg=black'

# Neovim recommended
set-option -g focus-events on
set-option -sg escape-time 10


# # Vim pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# battery and pomo status <http://git.io/zMf0IA>
# set -g status-right ' #(cat ~/.pomo_stat) #(battery) '
set -g status-interval 1


# Other
set -g mouse on

# disable possibly set visual editor
set-environment -gu GEM_EDITOR

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# disable the automatic mapping of <prefix> C-l to send C-l (which is intended to restore the "clear screen" functionality):
set -g @vim_navigator_prefix_mapping_clear_screen ""

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

# Configure the catppuccin plugin
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_user "on"
set -g @catppuccin_host "on"
set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format ""

set -g window-status-format " #I#{?#{!=:#{window_name},},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
#
set -g window-status-current-format " #I#{?#{!=:#{window_name},},: #W,} *"
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
#
# # status left look and feel
set -g status-left-length 100
set -g status-left ""

set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_teal}]  session: #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_lavender}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_mauve}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_green}]#{?window_zoomed_flag,  zoom ,}"
#
# # status right look and feel
set -g status-right-length 100
set -g status-right ""
## set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_green}] #(cd #{pane_current_path}; git branch --show-current)"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_lavender},fg=#{@thm_crust}] 󰭦 %A, %d-%b-%Y "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_teal},fg=#{@thm_crust}] 󰅐 %H:%M "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_fi}]"


# Tmux-resurrect: save and restore working tmux sessions after restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
