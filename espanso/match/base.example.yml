# espanso match file - EXAMPLE (sanitized template)
# This file contains example matches without sensitive information
# Copy this to base.yml and fill in your own values

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

matches:
  # Basic text replacement
  - trigger: ":espanso"
    replace: "C:\\Users\\YourUsername\\AppData\\Roaming\\espanso\\match\\base.yml"

  # Date and time
  - trigger: ":date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%m/%d/%Y"

  # Shell command output
  - trigger: ":shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # Personal information (replace with your actual values)
  - trigger: ":name"
    replace: "Your Name"

  - trigger: ":em1"
    replace: "your.email@example.com"

  - trigger: ":lnkd"
    replace: "https://www.linkedin.com/in/your-profile"

  - trigger: ":gh"
    replace: "https://github.com/your-username"

  - trigger: ":pwb"
    replace: "https://your-website.com"

  # Organization
  - trigger: ":org"
    replace: "Your Organization Name"

  # Git/development triggers
  - trigger: ":gcd"
    replace: "debugging"

  - trigger: ":gcr"
    replace: "refactoring"

  - trigger: ":gcdel"
    replace: "removed files"

  - trigger: ":gcu"
    replace: "updated code"

  # Email signature
  - trigger: ":ems"
    replace: "Sincerely, \nYour Name"

  # Common phrases
  - trigger: ":gm"
    replace: "Good morning"
