# packages.conf - Configuration-driven package installation manifest
# Format: canonical-name  group  [apk=name] [apt=name] [brew=name] [install=custom]
# Groups: util, editor, shell, terminal, languages (skipped with --minimal); optional (prompts user)
# Packages with identical names across managers need no overrides
# Packages with per-manager variations use key=value tokens (e.g., apt=fd-find)
# Packages requiring custom install logic use install=custom

zsh        shell
tree       util
neovim     editor    apk=neovim
fzf        util
ripgrep    util
tmux       terminal
go         languages  apt=golang-go
python3    languages
nvm        languages  install=custom
pyenv      optional   install=custom
espanso    optional   install=custom
